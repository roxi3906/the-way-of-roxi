interface:
  display_name: "Roxi's Way"
  short_description: "Follow the user's delivery, communication, and comment rules"
  default_prompt: "Use $roxis-way to implement this task following the user's communication, testing, PR, and code comment rules. Apply the comment rules when writing, editing, adding, or substantially rewriting code; when the task involves code comments, comment cleanup, comment language, readability, confusing code, or hard-to-read code; or when generating code snippets intended for a repository. Add comments only for code written in the current task, and do not treat untouched existing code as requiring comment rewrites. Add comments for each logical block you write and for important, easy-to-confuse, or hard-to-read code paths. Use brief responsibility-focused comments for simple logic and more detailed comments for complex logic. Follow the file's dominant existing comment language or the nearest surrounding comment style when clear, default to Chinese when it is not, and avoid comments that only restate the code."
