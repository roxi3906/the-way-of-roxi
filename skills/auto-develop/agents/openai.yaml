interface:
  display_name: "Auto Develop"
  short_description: "Run session-long delivery with phase tracking"
  default_prompt: "Use $auto-develop to keep autonomous delivery active for this session through reviewed draft PRs, synchronize configured project-management tracking across every delivery phase, persist each decision in a Git-ignored private {task-summary}-decision-tree.md, and report its absolute path with the complete decision tree."
policy:
  allow_implicit_invocation: false
